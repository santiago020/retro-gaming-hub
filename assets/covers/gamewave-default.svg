<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0a0b12" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#bg)" />
  <circle cx="200" cy="230" r="90" fill="#0c4a6e" stroke="#06b6d4" stroke-width="4" filter="url(#glow)" />
  <text x="200" y="220" font-family="system-ui, sans-serif" font-weight="900" font-size="50" fill="#38bdf8" text-anchor="middle">🌊</text>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">GAMEWAVE PORT</text>
  <rect x="0" y="440" width="400" height="160" fill="#0a0b12" fill-opacity="0.95" />
  <text x="200" y="500" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">GAMEWAVE DIGITAL</text>
  <text x="200" y="535" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle">Biblioteca de Ports y Emuladores</text>
</svg>
